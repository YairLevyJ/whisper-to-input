name: Build

# Continuous check that the app still compiles, plus a throwaway APK for testing a branch.
#
# What this produces is a *debug* build, which is not the same artifact as a release:
# it is debuggable, and it is signed with a throwaway key the runner generates per job,
# so APKs from two different runs cannot be installed over one another.
# Use the Release workflow for anything meant to stay installed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # AGP 8.1 requires JDK 17; the runner's default JDK may be newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Makes sure the SDK is present and its licenses are accepted up front. Without this,
      # AGP can block indefinitely waiting for a license prompt that has nowhere to read from.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        # --console=plain keeps the output non-interactive and line-oriented, so a stall is
        # visible in the log instead of hidden behind the rich console renderer.
        run: ./gradlew assembleDebug --console=plain --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
