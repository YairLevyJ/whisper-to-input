name: Build

# Manually-triggered check that the app still compiles, plus a signed APK for trying a branch
# out on a device before cutting a real release.
#
# This builds the *release* build type, signed with the same keystore as the Release workflow,
# so it installs cleanly over an existing release build already on the device (Android refuses
# an update whose signing certificate differs from the installed one). It needs the same four
# secrets as Release - see docs/RELEASING.md.
#
# This is not a substitute for the Release workflow: nothing here is published, and the APK
# carries no build provenance attestation or version tag.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Building whisper.cpp for two ABIs adds real time next to the plain Kotlin build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The local Whisper inference engine (whisper.cpp) is vendored as a submodule.
          submodules: recursive

      # AGP 8.1 requires JDK 17; the runner's default JDK may be newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Makes sure the SDK is present and its licenses are accepted up front. Without this,
      # AGP can block indefinitely waiting for a license prompt that has nowhere to read from.
      # ndk/cmake are needed to compile the local-model native inference engine (whisper.cpp).
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.1.10909125 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      # Without an override, versionCode falls back to the placeholder in build.gradle.kts (6),
      # which is far below any real release's versionCode (derived from its major.minor.patch).
      # Android refuses to install an APK with a lower versionCode over one already installed
      # (INSTALL_FAILED_VERSION_DOWNGRADE, surfaced to the user as a bare "App not installed"),
      # so this build would never actually install over a published release. A Unix timestamp is
      # comfortably above any realistic manual version code and strictly increasing run over run.
      - name: Compute a versionCode guaranteed to be newer than any published release
        id: version
        run: echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See docs/RELEASING.md for how to create the keystore and add the four secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # --console=plain keeps the output non-interactive and line-oriented, so a stall is
        # visible in the log instead of hidden behind the rich console renderer.
        run: |
          ./gradlew assembleRelease --console=plain --no-daemon --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }}

      # Guards against silently uploading an unsigned APK, which would not install over an
      # existing signed copy at all.
      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
