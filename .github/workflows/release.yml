name: Release

# Builds the distributable APK, records a GitHub-signed provenance attestation for it,
# and publishes it as a GitHub Release.
#
# Two independent signatures are involved, and they prove different things:
#
#   * The APK signature (this repository's own keystore, from the secrets below) is what
#     Android requires to install the app, and is what ties an update to the version
#     already installed. Android has no notion of a signature "from GitHub".
#
#   * The build provenance attestation is issued by GitHub's Sigstore instance against
#     this workflow's OIDC identity. It is what proves the APK really was produced by
#     this workflow, from this repository, at a specific commit. Anyone can check it:
#
#         gh attestation verify <asset-name> --repo <owner>/<repo>
#
# The version you type in (e.g. "1.1.0") is the single source of truth: it drives the git
# tag, the release title, the app's versionName, and its versionCode, so nothing needs to be
# bumped in the source beforehand. The published asset is always named <app-name>-v<version>.apk,
# where <app-name> is read from the app_name string resource.
#
# Setting up the signing secrets is documented in docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, major.minor.patch, e.g. 1.1.0 (no leading "v" - added automatically)'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write      # create the release and upload the APK to it
  id-token: write      # request the OIDC token the attestation is bound to
  attestations: write  # record the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    # Building whisper.cpp for two ABIs adds real time next to the plain Kotlin build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The local Whisper inference engine (whisper.cpp) is vendored as a submodule.
          submodules: recursive

      - name: Compute version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be major.minor.patch, e.g. 1.1.0 (got: '$VERSION')"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Deterministic function of the version number, so versionCode never needs to be
          # tracked as separate state - it is always derived fresh from what you type in.
          # Stays strictly increasing release over release as long as minor and patch each
          # stay below 100, which is the same assumption most Android version-code schemes make.
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Version $VERSION -> versionCode $VERSION_CODE, tag v$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release asset name
        id: asset
        run: |
          APP_NAME=$(grep -oP '(?<=<string name="app_name">)[^<]+' android/app/src/main/res/values/strings.xml)
          if [ -z "$APP_NAME" ]; then
            echo "::error::Could not read app_name from res/values/strings.xml"
            exit 1
          fi
          ASSET_NAME="${APP_NAME}-${{ steps.version.outputs.tag }}.apk"
          echo "Asset name: $ASSET_NAME"
          echo "name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.1.10909125 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See docs/RELEASING.md for how to create the keystore and add the four secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK to release asset name
        run: |
          mkdir -p android/app/build/outputs/apk/release/dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/apk/release/dist/${{ steps.asset.outputs.name }}"

      # Guards against silently publishing an unsigned APK, which would not install at all.
      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs \
            "android/app/build/outputs/apk/release/dist/${{ steps.asset.outputs.name }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: android/app/build/outputs/apk/release/dist/${{ steps.asset.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          NOTES=$(cat <<EOF
          Speech-to-text keyboard, built from this repository by the Release workflow.

          ### Verifying this APK really came from this repository

          The APK carries a build provenance attestation issued by GitHub. To check it:

              gh attestation verify $ASSET_NAME --repo ${{ github.repository }}

          That confirms the file was produced by this repository's Release workflow at
          the commit this release was built from, and has not been modified since.

          ### Installing

              adb install -r $ASSET_NAME

          Or copy the APK to the device and open it. Enable the keyboard under
          Settings -> System -> Languages & input -> On-screen keyboard.
          EOF
          )
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/dist/$ASSET_NAME" \
            --title "$TAG" \
            --notes "$NOTES" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $FLAGS

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
